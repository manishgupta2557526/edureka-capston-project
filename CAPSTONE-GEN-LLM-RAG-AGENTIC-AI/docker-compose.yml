version: '3.9'
services:
  api:
    build: .
    container_name: enterprise-doc-agent
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      VECTOR_BACKEND: chroma
      CHROMA_PERSIST_DIR: /app/data/chroma
      CHROMA_COLLECTION: documents
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app

  streamlit:
    build: .
    container_name: enterprise-doc-streamlit
    depends_on:
      ollama-init:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      VECTOR_BACKEND: chroma
      CHROMA_PERSIST_DIR: /app/data/chroma
      CHROMA_COLLECTION: documents
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - .:/app

  ollama:
    image: ollama/ollama:latest
    container_name: enterprise-doc-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    container_name: enterprise-doc-ollama-init
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "llama3"]

volumes:
  ollama_data:
